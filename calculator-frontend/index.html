<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo">
                <span>🧮</span>
                <span class="logo-text">Pro Calculator</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="themeToggle" title="Toggle Theme">🌙</button>
                <button class="icon-btn" id="soundToggle" title="Sound">🔊</button>
                <button class="icon-btn" id="exportBtn" title="Export CSV">📥</button>
            </div>
        </div>

        <div class="main-grid">
            <!-- Calculator -->
            <div class="calculator-wrapper">
                <!-- Tabs for modes -->
                <div class="mode-tabs">
                    <button class="mode-tab active" data-mode="basic">Basic</button>
                    <button class="mode-tab" data-mode="scientific">Scientific</button>
                </div>

                <div class="calculator">
                    <!-- Display -->
                    <div class="display-section">
                        <div class="display-top">
                            <div class="expression" id="expression"></div>
                            <button class="copy-btn" id="copyBtn" title="Copy Result">📋</button>
                        </div>
                        <div class="result" id="result">0</div>
                    </div>

                    <!-- Basic Keypad -->
                    <div class="keypad" id="basicKeypad">
                        <button class="btn btn-func" data-action="clear">AC</button>
                        <button class="btn btn-func" data-action="backspace">⌫</button>
                        <button class="btn btn-func" data-action="percent">%</button>
                        <button class="btn btn-op" data-op="divide">÷</button>

                        <button class="btn btn-num" data-num="7">7</button>
                        <button class="btn btn-num" data-num="8">8</button>
                        <button class="btn btn-num" data-num="9">9</button>
                        <button class="btn btn-op" data-op="multiply">×</button>

                        <button class="btn btn-num" data-num="4">4</button>
                        <button class="btn btn-num" data-num="5">5</button>
                        <button class="btn btn-num" data-num="6">6</button>
                        <button class="btn btn-op" data-op="subtract">−</button>

                        <button class="btn btn-num" data-num="1">1</button>
                        <button class="btn btn-num" data-num="2">2</button>
                        <button class="btn btn-num" data-num="3">3</button>
                        <button class="btn btn-op" data-op="add">+</button>

                        <button class="btn btn-func" data-action="sign">±</button>
                        <button class="btn btn-num" data-num="0">0</button>
                        <button class="btn btn-num" data-action="decimal">.</button>
                        <button class="btn btn-equals" data-action="equals">=</button>
                    </div>

                    <!-- Scientific Keypad -->
                    <div class="keypad scientific-keypad" id="scientificKeypad" style="display:none;">
                        <button class="btn btn-sci" data-action="sqrt">√x</button>
                        <button class="btn btn-sci" data-action="power">x²</button>
                        <button class="btn btn-sci" data-action="reciprocal">1/x</button>
                        <button class="btn btn-sci" data-action="factorial">n!</button>

                        <button class="btn btn-sci" data-action="sin">sin</button>
                        <button class="btn btn-sci" data-action="cos">cos</button>
                        <button class="btn btn-sci" data-action="tan">tan</button>
                        <button class="btn btn-sci" data-action="pi">π</button>

                        <button class="btn btn-sci" data-action="log">log</button>
                        <button class="btn btn-sci" data-action="ln">ln</button>
                        <button class="btn btn-sci" data-action="e">e</button>
                        <button class="btn btn-sci" data-action="exp">eˣ</button>
                    </div>

                    <!-- Action Bar -->
                    <div class="action-bar">
                        <button class="save-btn" id="saveBtn" disabled>💾 Save to History</button>
                        <button class="favorite-btn" id="favoriteBtn" title="Add to Favorites">⭐</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: History + Stats -->
            <div class="side-panel">
                <!-- Stats -->
                <div class="stats-card">
                    <div class="stat-item">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="favoritesCount">0</div>
                        <div class="stat-label">Favorites</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="todayCount">0</div>
                        <div class="stat-label">Today</div>
                    </div>
                </div>

                <!-- Search -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search history...">
                </div>

                <!-- History -->
                <div class="history-panel">
                    <div class="history-header">
                        <h2>📜 History</h2>
                        <button class="clear-history-btn" id="clearHistoryBtn" title="Clear All">🗑️</button>
                    </div>
                    <ul class="history-list" id="historyList">
                        <li class="empty-state">No calculations yet</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
